name: FPGA-side Action

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "fpga/**"
      - ".verilog_format"
      - ".github/workflows/fpga.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "fpga/**"
      - ".verilog_format"
      - ".github/workflows/fpga.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-fpga
  cancel-in-progress: true

jobs:
  format:
    name: Formatter
    runs-on: ubuntu-latest

    steps:
      - name: Clone project
        uses: actions/checkout@v4

      - name: Install Verible
        uses: chipsalliance/verible-actions-common/install-verible@main

      - name: Run verible formatter
        run: make -C fpga format

  lint:
    name: Linter
    runs-on: ubuntu-latest

    steps:
      - name: Clone project
        uses: actions/checkout@v4

      - name: Install Verible
        uses: chipsalliance/verible-actions-common/install-verible@main

      - name: Run verible linter
        run: make -C fpga lint

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Clone project
        uses: actions/checkout@v4

      - name: Install OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4

      - name: Run iverilog simulator
        run: make -C fpga all
